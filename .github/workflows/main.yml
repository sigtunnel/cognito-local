name: CI

on:
  # This repository's default branch is dev; master (the upstream's branch) does not exist here,
  # so CI never ran. Publishing is unaffected: publish.yml and semantic-release (package.json) still release from master only.
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  # A manual run on dev may name a runner: one of the lab's Raspberry Pis (pi-worker-16gb-1, -2
  # or -3), whose runner group for this public repository takes only this workflow and
  # publish.yml, at dev (sigtunnel/lab-setup). Pushes and pull requests always run on GitHub's
  # runners.
  workflow_dispatch:
    inputs:
      runner:
        description: "A runner label (pi-worker-16gb-1, -2 or -3); empty: GitHub's ubuntu-latest"
        required: false
        default: ""

# Every job only reads the repository. This repository is public, so it cannot use
# github-workflows' private actions: no refuse-untrusted guard and no check-workflow-security here
# (the lab's benchmark checks it from github-workflows' side, with the no-guard findings accepted
# for this reason). Untrusted code cannot reach a lab runner anyway: only a manual run names a
# runner (a pull request's inputs.runner is empty, so its jobs run on ubuntu-latest), and the
# public runner group takes only this workflow and publish.yml, at dev.
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# Each job gets 10 minutes. On the lab's Raspberry Pis (2026-11-07) they took up to 3 min 46 s
# (Lint), 3 min 28 s to 4 min 50 s (Test), 4 min 22 s (Smoke Test) and 4 min 15 s (Build), mostly
# in setup-node and yarn install; on GitHub's runner each takes about 1 minute.
jobs:
  lint:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    name: Lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The two places that repeat .tool-versions: the Dockerfile's node images and package.json's
      # packageManager (CI's Node itself comes from .tool-versions). This repository is public, so
      # it cannot use github-workflows' check-tool-versions action, which is private.
      - name: Check the tool versions
        run: |
          node=$(awk '$1 == "nodejs" { print $2; exit }' .tool-versions)
          yarn=$(awk '$1 == "yarn" { print $2; exit }' .tool-versions)
          status=0
          while read -r line; do
            image=$(awk '{ print $2 }' <<<"$line")
            if [[ $image != "node:$node-"* && $image != "node:$node" ]]; then
              echo "::error file=Dockerfile::$image differs from nodejs $node in .tool-versions"
              status=1
            fi
          done < <(grep -E '^FROM node:' Dockerfile)
          manager=$(node -p 'require("./package.json").packageManager' 2>/dev/null || true)
          if [[ $manager != "yarn@$yarn" ]]; then
            echo "::error file=package.json::packageManager $manager differs from yarn $yarn in .tool-versions"
            status=1
          fi
          exit $status
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: yarn
      # Yarn at package.json's packageManager version (.tool-versions' yarn).
      - run: corepack enable
      - run: yarn install
      - run: yarn lint

  test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    name: Test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: yarn
      # Yarn at package.json's packageManager version (.tool-versions' yarn).
      - run: corepack enable
      - run: yarn install
      - run: yarn test

  smoke_test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    name: Smoke Test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: yarn
      # Yarn at package.json's packageManager version (.tool-versions' yarn).
      - run: corepack enable
      - run: yarn install
      - run: scripts/smoke-test

  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    name: Build
    timeout-minutes: 10
    needs:
      - lint
      - test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: yarn
      # Yarn at package.json's packageManager version (.tool-versions' yarn).
      - run: corepack enable
      - run: yarn install
      - run: yarn build
